<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能助手 - Suni AI</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* 流式输出时的光标动画 */
        .streaming-cursor {
            display: inline-block;
            width: 8px;
            height: 18px;
            background: var(--primary);
            margin-left: 4px;
            animation: blink 1s infinite;
            vertical-align: middle;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        /* 消息内容样式优化 */
        .message-content {
            max-width: 70%;
            padding: 16px 20px;
            border-radius: var(--radius-lg);
            background: var(--secondary);
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        
        .message-content pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 12px;
            border-radius: var(--radius);
            overflow-x: auto;
            margin: 8px 0;
        }
        
        .message-content code {
            background: rgba(99, 102, 241, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
        }
        
        .message-content pre code {
            background: transparent;
            padding: 0;
        }
        
        /* 代码块复制按钮 */
        .code-block-wrapper {
            position: relative;
            margin: 8px 0;
        }
        
        .copy-code-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 4px 8px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 4px;
            color: #94a3b8;
            font-size: 12px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .code-block-wrapper:hover .copy-code-btn {
            opacity: 1;
        }
        
        .copy-code-btn:hover {
            background: rgba(255,255,255,0.2);
            color: white;
        }
    </style>
</head>
<body class="chat-page">
    <!-- 检查登录状态 -->
    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/login';
        }
        console.log('Token loaded:', token ? 'OK' : 'None');
    </script>

    <div class="chat-layout">
        <!-- 侧边栏 -->
        <aside class="chat-sidebar">
            <div class="sidebar-header">
                <a href="/" class="logo">
                    <span class="logo-icon">🌟</span>
                    <span class="logo-text">Suni AI</span>
                </a>
            </div>
            
            <!-- 知识库面板 -->
            <div class="knowledge-panel">
                <div class="panel-header">
                    <h3>📚 企业知识库</h3>
                </div>
                
                <div class="upload-section">
                    <input type="file" id="file-upload" multiple accept=".txt,.pdf,.docx,.xlsx,.md" hidden>
                    <button class="btn btn-outline btn-small" onclick="document.getElementById('file-upload').click()">
                        📤 上传文档
                    </button>
                </div>
                
                <div id="document-list" class="document-list">
                    <!-- 文档列表将通过 JS 加载 -->
                    <p class="empty-hint">暂无文档，点击上方按钮上传</p>
                </div>
            </div>
            
            <div class="sidebar-footer">
                <div class="user-info">
                    <span id="username">用户</span>
                </div>
                <div class="quota-info">
                    <div class="quota-item">
                        <span class="quota-label">💬 问答</span>
                        <span id="chat-quota" class="quota-value">--/--</span>
                    </div>
                    <div class="quota-item">
                        <span class="quota-label">📄 文档</span>
                        <span id="doc-quota" class="quota-value">--/--</span>
                    </div>
                </div>
                <button class="btn btn-outline btn-small" onclick="logout()">退出登录</button>
            </div>
        </aside>

        <!-- 主聊天区 -->
        <main class="chat-main">
            <div class="chat-header">
                <h2>Suni AI 智能助手</h2>
                <p>编程 · 写作 · 数据分析 · 文档问答，一站式 AI 办公</p>
            </div>
            
            <div id="chat-messages" class="chat-messages">
                <!-- 欢迎消息 -->
                <div class="message assistant">
                    <div class="message-avatar">🤖</div>
                    <div class="message-content">
                        <p>您好！我是 Suni AI 智能助手，您的全能办公搭档 💼</p>
                        <p>我可以帮您：</p>
                        <ul class="example-questions">
                            <li onclick="sendExample(this)">写一段 Python 爬虫代码</li>
                            <li onclick="sendExample(this)">帮我写一份产品推广文案</li>
                            <li onclick="sendExample(this)">生成一份季度工作总结 PPT 大纲</li>
                            <li onclick="sendExample(this)">分析这份 Excel 数据并给出建议</li>
                            <li onclick="sendExample(this)">起草一封客户合作邮件</li>
                            <li onclick="sendExample(this)">公司的年假政策是什么？</li>
                        </ul>
                        <p style="margin-top:10px;font-size:13px;color:#666;">
                            💡 上传企业文档后，我还可以基于您的内部知识回答问题
                        </p>
                    </div>
                </div>
            </div>
            
            <div class="chat-input-area">
                <div class="input-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="use-knowledge" checked>
                        使用知识库增强
                    </label>
                </div>
                <div class="input-wrapper">
                    <textarea 
                        id="message-input" 
                        placeholder="输入您的问题..." 
                        rows="1"
                        onkeydown="handleKeydown(event)"
                    ></textarea>
                    <button class="btn btn-primary" onclick="sendMessage()" id="send-btn">发送</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 用户信息
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        document.getElementById('username').textContent = user.username || '用户';
        
        // 当前是否正在流式接收
        let isStreaming = false;
        let currentMessageEl = null;
        
        // 加载用户配额信息
        async function loadUserQuota() {
            try {
                const response = await fetch('/api/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('chat-quota').textContent = 
                        `${data.remaining_chats}/${data.max_chats}`;
                    document.getElementById('doc-quota').textContent = 
                        `${data.remaining_docs}/${data.max_docs}`;
                    
                    // 如果问答次数用完，显示提示
                    if (data.remaining_chats <= 0) {
                        addSystemMessage(
                            '⛔ 您的免费试用次数已用完。如需 unlimited 使用，请联系我们定制化部署。'
                        );
                    }
                } else if (response.status === 401) {
                    // Token 过期，跳转登录
                    window.location.href = '/login';
                }
            } catch (error) {
                console.error('加载配额失败:', error);
            }
        }
        
        // 加载文档列表
        async function loadDocuments() {
            try {
                const response = await fetch('/api/knowledge/documents', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                const listEl = document.getElementById('document-list');
                
                if (data.documents && data.documents.length > 0) {
                    listEl.innerHTML = data.documents.map(doc => `
                        <div class="document-item ${doc.is_indexed ? 'indexed' : 'indexing'}">
                            <span class="doc-icon">📄</span>
                            <span class="doc-name">${doc.filename}</span>
                            <span class="doc-status">${doc.is_indexed ? '✓' : '⏳'}</span>
                            <button class="doc-delete" onclick="deleteDocument(${doc.id})">×</button>
                        </div>
                    `).join('');
                } else {
                    listEl.innerHTML = '<p class="empty-hint">暂无文档，点击上方按钮上传</p>';
                }
            } catch (error) {
                console.error('加载文档失败:', error);
            }
        }
        
        // 上传文档
        document.getElementById('file-upload').addEventListener('change', async (e) => {
            const files = e.target.files;
            
            for (const file of files) {
                const formData = new FormData();
                formData.append('file', file);
                
                try {
                    const response = await fetch('/api/knowledge/upload', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` },
                        body: formData
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        addSystemMessage(`📄 "${file.name}" 上传成功，正在建立索引...`);
                    } else {
                        addSystemMessage(`❌ "${file.name}" 上传失败: ${data.detail}`);
                    }
                } catch (error) {
                    addSystemMessage(`❌ 上传失败: ${error.message}`);
                }
            }
            
            // 清空文件选择
            e.target.value = '';
            
            // 刷新文档列表
            setTimeout(loadDocuments, 2000);
        });
        
        // 删除文档
        async function deleteDocument(docId) {
            if (!confirm('确定删除此文档？')) return;
            
            try {
                await fetch(`/api/knowledge/documents/${docId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                loadDocuments();
            } catch (error) {
                alert('删除失败');
            }
        }
        
        // 发送消息（流式版本）
        async function sendMessage() {
            const input = document.getElementById('message-input');
            const sendBtn = document.getElementById('send-btn');
            const message = input.value.trim();
            
            if (!message || isStreaming) return;
            
            const useKnowledge = document.getElementById('use-knowledge').checked;
            
            // 添加用户消息
            addMessage('user', message);
            input.value = '';
            
            // 禁用发送按钮
            sendBtn.disabled = true;
            sendBtn.textContent = '发送中...';
            isStreaming = true;
            
            // 创建AI消息容器
            currentMessageEl = addStreamingMessage();
            
            try {
                // 使用 fetch 读取流式响应
                const response = await fetch('/api/chat/stream', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'text/event-stream'
                    },
                    body: JSON.stringify({
                        message: message,
                        use_knowledge: useKnowledge
                    })
                });
                
                if (!response.ok) {
                    if (response.status === 401) {
                        updateStreamingMessage('🔒 登录已过期，请重新登录');
                        setTimeout(() => {
                            window.location.href = '/login';
                        }, 2000);
                        return;
                    }
                    const errorData = await response.json().catch(() => ({}));
                    updateStreamingMessage(`❌ ${errorData.detail || '请求失败'}`);
                    return;
                }
                
                // 读取流式数据
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullContent = '';
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            
                            if (data === '[DONE]') {
                                // 流结束
                                finalizeStreamingMessage(fullContent);
                            } else if (data.startsWith('[ERROR]')) {
                                updateStreamingMessage(`❌ ${data.slice(7)}`);
                            } else {
                                try {
                                    const parsed = JSON.parse(data);
                                    if (parsed.content) {
                                        fullContent += parsed.content;
                                        updateStreamingMessage(fullContent, true);
                                    }
                                    if (parsed.done) {
                                        finalizeStreamingMessage(fullContent);
                                    }
                                } catch (e) {
                                    // 忽略解析错误
                                }
                            }
                        }
                    }
                }
                
            } catch (error) {
                updateStreamingMessage(`❌ 请求失败: ${error.message}`);
            } finally {
                isStreaming = false;
                sendBtn.disabled = false;
                sendBtn.textContent = '发送';
                currentMessageEl = null;
                
                // 刷新配额
                loadUserQuota();
            }
        }
        
        // 添加普通消息
        function addMessage(role, content) {
            const container = document.getElementById('chat-messages');
            const id = 'msg-' + Date.now();
            
            const messageEl = document.createElement('div');
            messageEl.className = `message ${role}`;
            messageEl.id = id;
            
            if (role === 'user') {
                messageEl.innerHTML = `
                    <div class="message-content">
                        <p>${escapeHtml(content)}</p>
                    </div>
                    <div class="message-avatar">👤</div>
                `;
            } else {
                messageEl.innerHTML = `
                    <div class="message-avatar">🤖</div>
                    <div class="message-content">
                        <p>${formatResponse(content)}</p>
                    </div>
                `;
            }
            
            container.appendChild(messageEl);
            scrollToBottom();
            
            return id;
        }
        
        // 添加流式消息（带光标）
        function addStreamingMessage() {
            const container = document.getElementById('chat-messages');
            const id = 'msg-stream-' + Date.now();
            
            const messageEl = document.createElement('div');
            messageEl.className = 'message assistant';
            messageEl.id = id;
            messageEl.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    <p><span class="streaming-content"></span><span class="streaming-cursor"></span></p>
                </div>
            `;
            
            container.appendChild(messageEl);
            scrollToBottom();
            
            return messageEl;
        }
        
        // 更新流式消息内容
        function updateStreamingMessage(content, isStreaming = false) {
            if (!currentMessageEl) return;
            
            const contentSpan = currentMessageEl.querySelector('.streaming-content');
            const cursor = currentMessageEl.querySelector('.streaming-cursor');
            
            if (contentSpan) {
                contentSpan.innerHTML = formatResponse(content);
            }
            
            // 如果是完成状态，移除光标
            if (!isStreaming && cursor) {
                cursor.remove();
            }
            
            scrollToBottom();
        }
        
        // 完成流式消息
        function finalizeStreamingMessage(content) {
            if (!currentMessageEl) return;
            
            const contentEl = currentMessageEl.querySelector('.message-content');
            if (contentEl) {
                contentEl.innerHTML = `<p>${formatResponse(content)}</p>`;
            }
            
            scrollToBottom();
        }
        
        // 添加系统消息
        function addSystemMessage(content) {
            const container = document.getElementById('chat-messages');
            const messageEl = document.createElement('div');
            messageEl.className = 'message system';
            messageEl.innerHTML = `<div class="system-notice">${content}</div>`;
            container.appendChild(messageEl);
            scrollToBottom();
        }
        
        // 滚动到底部
        function scrollToBottom() {
            const container = document.getElementById('chat-messages');
            container.scrollTop = container.scrollHeight;
        }
        
        // 示例问题点击
        function sendExample(el) {
            document.getElementById('message-input').value = el.textContent;
            sendMessage();
        }
        
        // 键盘事件
        function handleKeydown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }
        
        // HTML 转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // 格式化响应（支持 Markdown）
        function formatResponse(text) {
            if (!text) return '';
            
            let formatted = escapeHtml(text);
            
            // 代码块 (```code```)
            formatted = formatted.replace(/```(\w+)?\n([\s\S]*?)```/g, (match, lang, code) => {
                return `<div class="code-block-wrapper">
                    <button class="copy-code-btn" onclick="copyCode(this)">复制</button>
                    <pre><code class="language-${lang || ''}">${code.trim()}</code></pre>
                </div>`;
            });
            
            // 行内代码 (`code`)
            formatted = formatted.replace(/`([^`]+)`/g, '<code>$1</code>');
            
            // 粗体 (**text**)
            formatted = formatted.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            
            // 斜体 (*text*)
            formatted = formatted.replace(/\*(.+?)\*/g, '<em>$1</em>');
            
            // 换行
            formatted = formatted.replace(/\n/g, '<br>');
            
            return formatted;
        }
        
        // 复制代码
        function copyCode(btn) {
            const code = btn.nextElementSibling.querySelector('code').textContent;
            navigator.clipboard.writeText(code).then(() => {
                btn.textContent = '已复制!';
                setTimeout(() => btn.textContent = '复制', 2000);
            });
        }
        
        // 登出
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login';
        }
        
        // 初始化
        loadUserQuota();
        loadDocuments();
    </script>
</body>
</html>
