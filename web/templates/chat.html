<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能助手 - Suni AI</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* Thinking Spinner */
        .thinking-spinner {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            color: var(--primary);
        }
        .spinner-dots {
            display: inline-flex;
            gap: 4px;
        }
        .spinner-dots span {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .spinner-dots span:nth-child(1) { animation-delay: -0.32s; }
        .spinner-dots span:nth-child(2) { animation-delay: -0.16s; }
        .spinner-dots span:nth-child(3) { animation-delay: 0s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        .streaming-cursor {
            display: inline-block;
            width: 8px;
            height: 18px;
            background: var(--primary);
            margin-left: 4px;
            animation: blink 1s infinite;
            vertical-align: middle;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        .btn-stop {
            background: #ef4444 !important;
            border-color: #ef4444 !important;
        }
        .btn-stop:hover {
            background: #dc2626 !important;
        }
        /* Attachment styles */
        .btn-attachment {
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 8px 12px;
            color: var(--primary);
        }
        .btn-attachment:hover {
            background: rgba(99, 102, 241, 0.1);
        }
        .attachment-preview {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            background: rgba(99, 102, 241, 0.1);
            border-radius: var(--radius);
            margin-right: 8px;
            font-size: 13px;
            color: var(--primary);
        }
        .btn-remove-attachment {
            background: transparent;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 16px;
        }
        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .input-wrapper textarea {
            flex: 1;
        }
        .example-questions {
            list-style: none;
            padding: 0;
            margin: 8px 0;
        }
        .example-questions li {
            padding: 8px 12px;
            margin: 4px 0;
            background: rgba(99, 102, 241, 0.1);
            border-radius: var(--radius);
            cursor: pointer;
        }
        .example-questions li:hover {
            background: rgba(99, 102, 241, 0.2);
        }
    </style>
</head>
<body class="chat-page">
    <script>
        var token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/login';
        }
    </script>

    <div class="chat-layout">
        <aside class="chat-sidebar">
            <div class="sidebar-header">
                <a href="/" class="logo">
                    <span class="logo-icon">🌟</span>
                    <span class="logo-text">Suni AI</span>
                </a>
            </div>
            
            <div class="knowledge-panel">
                <div class="panel-header">
                    <h3>📚 企业知识库</h3>
                </div>
                <div id="kb-status" class="kb-status empty" style="display:none;">
                    💡 上传文档后，将自动启用知识库搜索能力
                </div>
                <div class="upload-section">
                    <input type="file" id="file-upload" multiple accept=".txt,.pdf,.doc,.docx" hidden>
                    <button class="btn btn-outline btn-small" onclick="document.getElementById('file-upload').click()" title="支持格式：txt, pdf, doc, docx；最大 2MB">
                        📤 上传文档
                    </button>
                    <span id="upload-status" style="margin-left:10px;font-size:12px;color:#94a3b8;"></span>
                </div>
                <div class="document-list-container">
                    <div id="document-list" class="document-list">
                        <p class="empty-hint">暂无文档</p>
                    </div>
                </div>
            </div>
            
            <!-- 报告面板 -->
            <div class="report-panel">
                <div class="panel-header">
                    <h3>📊 我的报告</h3>
                </div>
                <div id="report-list">
                    <p class="empty-hint" style="font-size: 12px; color: #94a3b8;">暂无报告</p>
                </div>
                <button class="btn btn-outline btn-small" onclick="loadReports()" style="margin-top: 8px; width: 100%;">
                    🔄 刷新列表
                </button>
            </div>
            

        </aside>

        <main class="chat-main">
            <div class="chat-header">
                <div class="chat-header-right">
                    <span id="username" class="header-username">用户</span>
                    <span class="header-divider">|</span>
                    <span class="header-quota" title="剩余次数">⚡ <span id="chat-quota">--</span></span>
                    <button class="header-logout" onclick="logout()" title="退出登录">退出</button>
                </div>
            </div>
            
            <div id="chat-messages" class="chat-messages">
                <div class="message assistant">
                    <div class="message-avatar">🤖</div>
                    <div class="message-content">
                        <p>您好！我是 Suni AI 智能助手 💼</p>
                        <p>您可以尝试：</p>
                        <ul class="example-questions">
                            <li onclick="sendExample(this)">💻 写一段 Python 爬虫代码</li>
                            <li onclick="sendExample(this)">📝 帮我写一份产品推广文案</li>
                            <li onclick="sendExample(this)">🔍 搜索企业知识库中的制度文档</li>
                        </ul>
                    </div>
                </div>
            </div>
            
            <div class="chat-input-area">
                <div class="search-options" style="padding: 8px 12px; display: flex; gap: 16px; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); flex-wrap: wrap;">
                    <label class="search-option" style="display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; color: #94a3b8;">
                        <input type="checkbox" id="web-search-toggle" style="cursor: pointer;">
                        <span>🔍 网页搜索</span>
                        <small style="color: #64748b;">（获取实时信息）</small>
                    </label>
                    <label class="search-option" style="display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; color: #94a3b8;">
                        <input type="checkbox" id="knowledge-toggle" checked style="cursor: pointer;">
                        <span>📚 知识库</span>
                        <small style="color: #64748b;">（企业文档）</small>
                    </label>
                    <label class="search-option" style="display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; color: #94a3b8;">
                        <input type="checkbox" id="report-toggle" style="cursor: pointer;">
                        <span>📊 报告生成</span>
                        <small style="color: #64748b;">（生成可下载文档）</small>
                    </label>
                </div>
                <div class="input-wrapper">
                    <input type="file" id="chat-attachment" accept=".jpg,.jpeg,.png,.gif,.webp,.txt,.pdf,.doc,.docx" hidden>
                    <button class="btn btn-attachment" onclick="document.getElementById('chat-attachment').click()" title="添加附件（≤1MB）">
                        📎
                    </button>
                    <div id="attachment-preview" class="attachment-preview" style="display:none;">
                        <span id="attachment-name"></span>
                        <button class="btn-remove-attachment" onclick="clearAttachment()">×</button>
                    </div>
                    <textarea id="message-input" placeholder="输入您的问题..." rows="1" onkeydown="handleKeydown(event)"></textarea>
                    <button class="btn btn-primary" onclick="handleSendClick()" id="send-btn">发送</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Config
        var API_BASE = '';
        var user = JSON.parse(localStorage.getItem('user') || '{}');
        var isStreaming = false;
        var currentMessageEl = null;
        var currentReader = null;
        var documents = [];
        var kbReady = false;
        var currentAttachment = null;

        // Init
        document.getElementById('username').textContent = user.username || '用户';

        // API helper
        function apiGet(path) {
            return fetch(API_BASE + path, {
                headers: { 'Authorization': 'Bearer ' + token }
            }).then(function(r) {
                if (r.status === 401) {
                    window.location.href = '/login';
                    return null;
                }
                return r;
            });
        }

        // Load user quota
        function loadUserQuota() {
            apiGet('/api/me').then(function(r) {
                if (!r) return;
                r.json().then(function(data) {
                    // 右上角显示剩余次数
                    document.getElementById('chat-quota').textContent = data.remaining_chats;
                    if (data.remaining_chats <= 0) {
                        addSystemMessage('⛔ 您的免费试用次数已用完。如需 unlimited 使用，请联系我们：contact@suniai.com');
                    }
                });
            }).catch(function(e) {
                console.error('加载配额失败:', e);
            });
        }

        // Load documents
        function loadDocuments() {
            apiGet('/api/knowledge/documents').then(function(r) {
                if (!r) return;
                r.json().then(function(data) {
                    documents = data.documents || [];
                    kbReady = documents.some(function(d) { return d.is_indexed; });
                    renderDocuments();
                    updateKBStatus();
                });
            }).catch(function(e) {
                console.error('加载文档失败:', e);
            });
        }

        function renderDocuments() {
            var listEl = document.getElementById('document-list');
            if (documents.length === 0) {
                listEl.innerHTML = '<p class="empty-hint">暂无文档</p>';
                return;
            }
            listEl.innerHTML = documents.map(function(doc) {
                var statusClass = doc.is_indexed ? 'ready' : 'indexing';
                var statusText = doc.is_indexed ? '✓ 已就绪' : '⏳ 索引中';
                return '<div class="document-item ' + (doc.is_indexed ? 'indexed' : 'indexing') + '">' +
                    '<span class="doc-icon">📄</span>' +
                    '<span class="doc-name" title="' + doc.filename + '">' + doc.filename + '</span>' +
                    '<span class="doc-status ' + statusClass + '">' + statusText + '</span>' +
                    '<button class="doc-delete" onclick="deleteDocument(\'' + encodeURIComponent(doc.filename) + '\')">×</button>' +
                    '</div>';
            }).join('');
        }

        function updateKBStatus() {
            var statusEl = document.getElementById('kb-status');
            if (kbReady) {
                var indexedCount = documents.filter(function(d) { return d.is_indexed; }).length;
                statusEl.className = 'kb-status ready';
                statusEl.innerHTML = '✅ 知识库已就绪（' + indexedCount + ' 个文档），现在可以搜索企业知识了';
            } else if (documents.length > 0) {
                statusEl.className = 'kb-status';
                statusEl.innerHTML = '⏳ 正在构建知识库索引，请稍候...（不影响其他问答）';
            } else {
                statusEl.className = 'kb-status empty';
                statusEl.innerHTML = '💡 上传企业文档后，将自动启用知识库搜索能力';
            }
        }

        // Upload documents
        document.getElementById('file-upload').addEventListener('change', function(e) {
            var files = Array.from(e.target.files);
            if (files.length === 0) return;
            
            var statusEl = document.getElementById('upload-status');
            statusEl.textContent = '正在上传 ' + files.length + ' 个文档...';
            
            var successCount = 0;
            var errorCount = 0;
            var totalFiles = files.length;
            
            files.forEach(function(file) {
                var formData = new FormData();
                formData.append('file', file);
                
                fetch(API_BASE + '/api/knowledge/upload', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token },
                    body: formData
                }).then(function(r) {
                    if (r.ok) {
                        successCount++;
                        // 添加一个临时的"索引中"文档到列表
                        var tempDoc = {
                            filename: file.name,
                            is_indexed: false,
                            file_size: file.size,
                            file_type: file.name.split('.').pop()
                        };
                        documents.unshift(tempDoc);
                        renderDocuments();
                        addSystemMessage('📄 "' + file.name + '" 上传成功，正在后台建立索引（约需10-30秒）...');
                    } else {
                        return r.json().then(function(data) {
                            errorCount++;
                            addSystemMessage('❌ "' + file.name + '" 上传失败: ' + (data.detail || '上传失败'));
                        });
                    }
                }).catch(function(error) {
                    errorCount++;
                    addSystemMessage('❌ "' + file.name + '" 上传失败: ' + error.message);
                }).finally(function() {
                    if (successCount + errorCount === totalFiles) {
                        e.target.value = '';
                        if (successCount > 0) {
                            statusEl.textContent = '✓ 已上传 ' + successCount + '/' + totalFiles + ' 个文档，索引中...';
                            loadUserQuota();
                            // 立即刷新一次
                            loadDocuments();
                            // 然后每5秒检查一次，直到所有文档都索引完成
                            startIndexPolling();
                        } else {
                            statusEl.textContent = '✗ 上传失败';
                        }
                    }
                });
            });
        });
        
        // 索引状态轮询
        var indexPollTimer = null;
        function startIndexPolling() {
            if (indexPollTimer) clearInterval(indexPollTimer);
            
            var checkCount = 0;
            indexPollTimer = setInterval(function() {
                checkCount++;
                // 最多检查12次（1分钟）
                if (checkCount > 12) {
                    clearInterval(indexPollTimer);
                    indexPollTimer = null;
                    document.getElementById('upload-status').textContent = '';
                    return;
                }
                
                loadDocuments();
                
                // 检查是否所有文档都已索引
                var allIndexed = documents.every(function(d) { return d.is_indexed; });
                if (allIndexed && documents.length > 0) {
                    clearInterval(indexPollTimer);
                    indexPollTimer = null;
                    document.getElementById('upload-status').textContent = '✓ 所有文档索引完成';
                    addSystemMessage('✅ 知识库索引完成！现在可以搜索企业知识了。');
                }
            }, 5000);
        }

        // Delete document
        function deleteDocument(filename) {
            if (!confirm('确定删除此文档？')) return;
            fetch(API_BASE + '/api/knowledge/documents/' + filename, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token }
            }).then(function(r) {
                if (r.ok) {
                    addSystemMessage('📄 文档已删除');
                    loadDocuments();
                    loadUserQuota();
                } else {
                    return r.json().then(function(data) {
                        alert(data.detail || '删除失败');
                    });
                }
            }).catch(function(error) {
                alert('删除失败: ' + error.message);
            });
        }

        // Chat attachment handling
        document.getElementById('chat-attachment').addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (!file) return;

            // 1MB limit for chat attachments
            if (file.size > 1 * 1024 * 1024) {
                addSystemMessage('❌ 文件过大（' + (file.size/1024/1024).toFixed(1) + 'MB），最大支持 1MB');
                e.target.value = '';
                return;
            }

            var ext = file.name.split('.').pop().toLowerCase();
            var allowed = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'txt', 'pdf', 'doc', 'docx'];
            if (allowed.indexOf(ext) === -1) {
                addSystemMessage('❌ 不支持的文件类型: ' + ext + '。支持图片和文档(txt/pdf/doc/docx)');
                e.target.value = '';
                return;
            }

            currentAttachment = file;

            var previewEl = document.getElementById('attachment-preview');
            var nameEl = document.getElementById('attachment-name');
            var imageExts = ['jpg', 'jpeg', 'png', 'gif', 'webp'];
            var icon = imageExts.indexOf(ext) !== -1 ? '🖼️' : '📄';

            nameEl.textContent = icon + ' ' + file.name;
            previewEl.style.display = 'inline-flex';
        });

        function clearAttachment() {
            currentAttachment = null;
            document.getElementById('chat-attachment').value = '';
            document.getElementById('attachment-preview').style.display = 'none';
        }

        // Send/Stop button handler
        function handleSendClick() {
            if (isStreaming) {
                stopStreaming();
            } else {
                sendMessage();
            }
        }

        function stopStreaming() {
            if (currentReader) {
                currentReader.cancel();
                currentReader = null;
            }
            isStreaming = false;
            var sendBtn = document.getElementById('send-btn');
            sendBtn.className = 'btn btn-primary';
            sendBtn.textContent = '发送';
            sendBtn.disabled = false;
            if (currentMessageEl) {
                var spinner = currentMessageEl.querySelector('.thinking-spinner');
                if (spinner) {
                    spinner.innerHTML = '<span style="color:#94a3b8">已停止</span>';
                }
            }
            addSystemMessage('⏹️ 已停止回答');
        }

        async function sendMessage() {
            var input = document.getElementById('message-input');
            var sendBtn = document.getElementById('send-btn');
            var message = input.value.trim();
            var attachmentFile = currentAttachment;

            if (!message && !attachmentFile) return;
            if (isStreaming) return;

            // Check quota
            var quotaEl = document.getElementById('chat-quota');
            var quotaText = quotaEl.textContent;
            if (quotaText && quotaText.indexOf('0/') === 0) {
                addSystemMessage('⛔ 您的免费试用次数已用完。如需 unlimited 使用，请联系我们：contact@suniai.com');
                return;
            }

            // Display user message
            var displayMessage = message;
            if (attachmentFile) {
                var ext = attachmentFile.name.split('.').pop().toLowerCase();
                var imageExts = ['jpg', 'jpeg', 'png', 'gif', 'webp'];
                var icon = imageExts.indexOf(ext) !== -1 ? '🖼️' : '📄';
                displayMessage = message ? icon + ' [' + attachmentFile.name + '] ' + message : icon + ' [' + attachmentFile.name + ']';
            }
            addMessage('user', displayMessage);
            input.value = '';
            clearAttachment();

            // Switch to stop button
            sendBtn.className = 'btn btn-primary btn-stop';
            sendBtn.textContent = '⏹ 停止';
            sendBtn.disabled = false;
            isStreaming = true;

            // Create AI message container
            currentMessageEl = addThinkingMessage();

            try {
                var response;

                if (attachmentFile) {
                    // Send with attachment
                    var formData = new FormData();
                    formData.append('message', message);
                    formData.append('file', attachmentFile);

                    response = await fetch(API_BASE + '/api/chat/attachment/stream', {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Bearer ' + token,
                            'Accept': 'text/event-stream'
                        },
                        body: formData
                    });
                } else {
                    // Normal chat
                    var useWebSearch = document.getElementById('web-search-toggle').checked;
                    var useKnowledge = document.getElementById('knowledge-toggle').checked;
                    var useReport = document.getElementById('report-toggle').checked;
                    
                    response = await fetch(API_BASE + '/api/chat/stream', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + token,
                            'Accept': 'text/event-stream'
                        },
                        body: JSON.stringify({
                            message: message,
                            use_knowledge: useKnowledge && kbReady,
                            use_web_search: useWebSearch,
                            use_report: useReport
                        })
                    });
                }

                if (!response.ok) {
                    if (response.status === 401) {
                        updateStreamingMessage('🔒 登录已过期，请重新登录');
                        setTimeout(function() { window.location.href = '/login'; }, 2000);
                        return;
                    }
                    var errorText = await response.text().catch(function() { return ''; });
                    var errorMsg = '请求失败 (' + response.status + ')';
                    try {
                        var errData = JSON.parse(errorText);
                        errorMsg = errData.detail || errorMsg;
                    } catch(e) {}
                    updateStreamingMessage('❌ ' + errorMsg);
                    return;
                }

                // Read stream
                currentReader = response.body.getReader();
                var decoder = new TextDecoder();
                var fullContent = '';
                var started = false;

                while (true) {
                    var readResult = await currentReader.read();
                    if (readResult.done) break;

                    var chunk = decoder.decode(readResult.value, { stream: true });
                    var lines = chunk.split('\n');

                    for (var i = 0; i < lines.length; i++) {
                        var line = lines[i];
                        if (line.indexOf('data: ') === 0) {
                            var data = line.slice(6);

                            if (data === '[DONE]') {
                                finalizeStreamingMessage(fullContent);
                            } else {
                                try {
                                    var parsed = JSON.parse(data);
                                    if (parsed.content) {
                                        if (!started) {
                                            started = true;
                                            switchToStreamingMode();
                                        }
                                        fullContent += parsed.content;
                                        updateStreamingMessage(fullContent, true);
                                    }
                                } catch (e) {}
                            }
                        }
                    }
                }

            } catch (error) {
                console.error('请求失败:', error);
                if (error.name === 'AbortError') return;
                updateStreamingMessage('❌ 连接失败: ' + error.message);
            } finally {
                isStreaming = false;
                currentReader = null;
                sendBtn.className = 'btn btn-primary';
                sendBtn.textContent = '发送';
                sendBtn.disabled = false;
                currentMessageEl = null;
                loadUserQuota();
                
                // 检查是否需要生成报告（方案1：前端检测关键词）
                var useReport = document.getElementById('report-toggle').checked;
                if (useReport && fullContent) {
                    checkAndGenerateReport(message, fullContent);
                }
            }
        }

        // Message rendering
        function addMessage(role, content) {
            var container = document.getElementById('chat-messages');
            var messageEl = document.createElement('div');
            messageEl.className = 'message ' + role;
            
            if (role === 'user') {
                messageEl.innerHTML = '<div class="message-content"><p>' + escapeHtml(content) + '</p></div><div class="message-avatar">👤</div>';
            } else {
                messageEl.innerHTML = '<div class="message-avatar">🤖</div><div class="message-content"><p>' + formatResponse(content) + '</p></div>';
            }
            
            container.appendChild(messageEl);
            scrollToBottom();
            return messageEl;
        }

        function addThinkingMessage() {
            var container = document.getElementById('chat-messages');
            var messageEl = document.createElement('div');
            messageEl.className = 'message assistant';
            messageEl.innerHTML = '<div class="message-avatar">🤖</div><div class="message-content"><div class="thinking-spinner"><div class="spinner-dots"><span></span><span></span><span></span></div><span class="thinking-text">思考中...</span></div></div>';
            container.appendChild(messageEl);
            scrollToBottom();
            return messageEl;
        }

        function switchToStreamingMode() {
            if (!currentMessageEl) return;
            var contentEl = currentMessageEl.querySelector('.message-content');
            if (contentEl) {
                contentEl.innerHTML = '<p><span class="streaming-content"></span><span class="streaming-cursor"></span></p>';
            }
        }

        function updateStreamingMessage(content, streaming) {
            if (!currentMessageEl) return;
            var contentSpan = currentMessageEl.querySelector('.streaming-content');
            var cursor = currentMessageEl.querySelector('.streaming-cursor');
            if (contentSpan) contentSpan.innerHTML = formatResponse(content);
            if (!streaming && cursor) cursor.remove();
            scrollToBottom();
        }

        function finalizeStreamingMessage(content) {
            if (!currentMessageEl) return;
            var contentEl = currentMessageEl.querySelector('.message-content');
            if (contentEl) contentEl.innerHTML = '<p>' + formatResponse(content) + '</p>';
            scrollToBottom();
        }

        function addSystemMessage(content) {
            var container = document.getElementById('chat-messages');
            var messageEl = document.createElement('div');
            messageEl.className = 'message system';
            messageEl.innerHTML = '<div class="system-notice">' + content + '</div>';
            container.appendChild(messageEl);
            scrollToBottom();
        }

        function scrollToBottom() {
            var container = document.getElementById('chat-messages');
            container.scrollTop = container.scrollHeight;
        }

        // Utils
        function sendExample(el) {
            var text = el.textContent.replace(/^[^\s]+\s/, '');
            document.getElementById('message-input').value = text;
            sendMessage();
        }

        function handleKeydown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSendClick();
            }
        }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatResponse(text) {
            if (!text) return '';
            var formatted = escapeHtml(text);
            formatted = formatted.replace(/```(\w+)?\n([\s\S]*?)```/g, function(match, lang, code) {
                return '<pre><code>' + code.trim() + '</code></pre>';
            });
            formatted = formatted.replace(/`([^`]+)`/g, '<code>$1</code>');
            formatted = formatted.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            formatted = formatted.replace(/\n/g, '<br>');
            return formatted;
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login';
        }

        // ==================== 报告功能 ====================
        
        // 检测是否需要生成文档（基于关键词）
        function checkAndGenerateReport(query, response) {
            // 文档相关关键词
            var docKeywords = ['报告', '文档', '总结', '分析', '调研', '研究', '会议纪要', '会议记录', '周报', '月报', '方案', '计划书', '说明书'];
            var generateKeywords = ['生成', '写', '制作', '创建', '导出', '下载'];

            // 检查是否包含文档关键词 + 生成关键词
            var hasDocKeyword = docKeywords.some(function(kw) {
                return query.indexOf(kw) !== -1;
            });
            var hasGenerateKeyword = generateKeywords.some(function(kw) {
                return query.indexOf(kw) !== -1;
            });

            // 如果用户明确要求生成文档
            if (hasDocKeyword && hasGenerateKeyword) {
                console.log('[Document] 检测到文档生成请求，正在生成...');
                generateReportFromResponse(query, response);
            }
        }
        
        // 从响应生成报告
        async function generateReportFromResponse(query, response) {
            try {
                // 提取标题（使用查询的前20个字符）
                var title = query.length > 20 ? query.substring(0, 20) + '...' : query;
                
                // 清理响应内容（移除HTML标签）
                var cleanContent = response.replace(/<br\s*\/?>/gi, '\n')
                                           .replace(/<[^>]+>/g, '');
                
                // 调用报告生成API
                var reportResponse = await fetch(API_BASE + '/api/report/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({
                        title: title,
                        content: cleanContent,
                        format: 'md',
                        sources: []
                    })
                });
                
                if (reportResponse.ok) {
                    var data = await reportResponse.json();
                    addSystemMessage('📊 报告已生成: <a href="#" onclick="downloadReport(\'' + data.filename + '\'); return false;" style="color: #6366f1;">' + data.filename + '</a>（请在左侧"我的报告"中查看）');
                    loadReports(); // 刷新报告列表
                } else {
                    console.error('[Report] 生成报告失败:', await reportResponse.text());
                }
            } catch (e) {
                console.error('[Report] 生成报告出错:', e);
            }
        }
        
        // 加载报告列表
        async function loadReports() {
            try {
                const response = await apiGet('/api/report/list');
                if (!response) return;
                
                const data = await response.json();
                const listEl = document.getElementById('report-list');
                
                if (data.reports.length === 0) {
                    listEl.innerHTML = '<p class="empty-hint" style="font-size: 12px; color: #94a3b8;">暂无报告</p>';
                    return;
                }
                
                listEl.innerHTML = data.reports.map(function(r) {
                    const size = r.size < 1024 ? r.size + 'B' : (r.size/1024).toFixed(1) + 'KB';
                    const date = new Date(r.created).toLocaleDateString();
                    return `
                        <div class="report-item" style="padding: 8px; background: rgba(255,255,255,0.05); border-radius: 4px; margin-bottom: 6px; font-size: 12px;">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px;" title="${r.filename}">${r.filename}</span>
                                <span style="color: #94a3b8; font-size: 11px;">${size}</span>
                            </div>
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
                                <span style="color: #64748b; font-size: 10px;">${date}</span>
                                <a href="#" onclick="downloadReport('${r.filename}'); return false;" style="color: #6366f1; font-size: 11px; text-decoration: none;">下载</a>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                console.error('加载报告失败:', e);
            }
        }
        
        // 下载报告（带认证）
        async function downloadReport(filename) {
            try {
                const response = await fetch(API_BASE + '/api/report/download/' + encodeURIComponent(filename), {
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                });
                
                if (!response.ok) {
                    if (response.status === 401) {
                        alert('登录已过期，请重新登录');
                        window.location.href = '/login';
                        return;
                    }
                    throw new Error('下载失败: ' + response.status);
                }
                
                // 获取文件内容并创建下载
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
            } catch (e) {
                console.error('下载报告失败:', e);
                alert('下载失败: ' + e.message);
            }
        }
        
        // 生成报告
        async function generateReport(title, content, sources, format) {
            try {
                const response = await fetch(`${API_BASE}/api/report/generate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        title: title,
                        content: content,
                        format: format || 'html',
                        sources: sources || []
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    addSystemMessage(`📊 报告已生成: <a href="${API_BASE}${data.download_url}" target="_blank" style="color: #6366f1;">${data.filename}</a>`);
                    loadReports(); // 刷新报告列表
                    return data;
                } else {
                    addSystemMessage('❌ 报告生成失败');
                }
            } catch (e) {
                console.error('生成报告失败:', e);
                addSystemMessage('❌ 报告生成失败: ' + e.message);
            }
        }

        // Startup
        loadUserQuota();
        loadDocuments();
        loadReports();
    </script>
</body>
</html>
